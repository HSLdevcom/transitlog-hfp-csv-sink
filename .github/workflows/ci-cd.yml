name: CI/CD

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-kotlin.yml@234db0afad207e5af97e17e597b9f0933d22b4c0 # main
    permissions:
      contents: read
      packages: read
    with:
      runTestsInsideDocker: true
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish-edge-tag:
    needs: ci-cd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_INFODEVOPS_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_INFODEVOPS_TOKEN }}
      - name: Tag the main image as edge
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image_name="${REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "${image_name}:edge" \
            "${image_name}:main"
